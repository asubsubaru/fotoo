name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Gradle 7.6.1
        run: |
          wget -q https://services.gradle.org/distributions/gradle-7.6.1-bin.zip
          unzip -q gradle-7.6.1-bin.zip
          echo "$PWD/gradle-7.6.1/bin" >> $GITHUB_PATH

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses
        run: yes | sdkmanager --licenses || true

      - name: Install build tools
        run: sdkmanager "build-tools;33.0.2" "platforms;android-33"

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fotoo-apk
          path: app/build/outputs/apk/debug/*.apk
