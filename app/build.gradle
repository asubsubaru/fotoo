apply plugin: 'com.android.application'

android {
    compileSdkVersion 33
    buildToolsVersion "33.0.2"

    defaultConfig {
        applicationId "com.fotoo.app"
        minSdkVersion 19
        targetSdkVersion 33
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        debug { minifyEnabled false }
        release { minifyEnabled false }
    }
}

    // APK imzasız çıksın (tablette yüklenebilir)
    android.applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "fotoo_v1.apk"
        }
    }
}

dependencies {
    // Sadece WebView — ekstra kütüphane yok
}
