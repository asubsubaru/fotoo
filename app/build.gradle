apply plugin: 'com.android.application'

android {
    compileSdkVersion 28
    buildToolsVersion "28.0.3"

    defaultConfig {
        applicationId "com.fotoo.app"
        minSdkVersion 19          // Android 4.4
        targetSdkVersion 28
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            minifyEnabled false
        }
    }

    // APK imzasız çıksın (tablette yüklenebilir)
    android.applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "fotoo_v1.apk"
        }
    }
}

dependencies {
    // Sadece WebView — ekstra kütüphane yok
}
